name = "saboria-vision"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# The site allowed to call this API, e.g. "https://saboria.app". "*" allows any site.
ALLOWED_ORIGIN = "*"
# Contact Open Food Facts can reach you at if the app misbehaves (their rules ask for it).
OFF_CONTACT = "tu-correo@ejemplo.com"

# The API key is a secret, never put it here. Set it with:
#   npx wrangler secret put ANTHROPIC_API_KEY

# At most 10 photo scans per minute from one IP address, so a leaked URL
# can't drain your API credits in a loop. Raise it if real users hit it.
[[ratelimits]]
name = "PHOTO_LIMIT"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60
