  <style>
    :root {
      --bg: #F6F1E8;
      --surface: #FFFDF8;
      --ink: #1C2A1F;
      --muted: #6B7A6E;
      --line: #E4D9C5;
      --green: #2F6B3C;
      --gold: #D4A017;
      --goldsoft: #F8E7B0;
      --water: #2A7F9E;
      --safe-top: env(safe-area-inset-top);
      --safe-bot: env(safe-area-inset-bottom);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111;
      color: var(--ink);
    }
    #app {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100%;
      background: var(--bg);
      position: relative;
      overflow: hidden;
    }
    .screen { min-height: 100dvh; padding: calc(18px + var(--safe-top)) 16px calc(92px + var(--safe-bot)); }
    h1 { font-size: 26px; margin: 0 0 6px; }
    h2 { font-size: 20px; margin: 18px 0 8px; }
    p.muted { color: var(--muted); margin: 0 0 12px; line-height: 1.4; }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
      margin-top: 12px;
    }
    .btn {
      width: 100%;
      border: 0;
      background: var(--green);
      color: #fff;
      font-weight: 700;
      font-size: 16px;
      padding: 14px;
      border-radius: 14px;
      margin-top: 14px;
    }
    .btn:disabled { opacity: .4; }
    .btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 10px 14px;
      font-weight: 650;
    }
    .chip.on { background: var(--green); color: #fff; border-color: var(--green); }
    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      font-size: 16px;
      margin-top: 8px;
    }
    .tabs {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 0;
      width: min(430px, 100%);
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      background: var(--surface);
      border-top: 1px solid var(--line);
      padding: 8px 6px calc(8px + var(--safe-bot));
    }
    .tab { border: 0; font-size: 11px; background: none; font-size: 11px; font-weight: 700; color: var(--muted); }
    .tab.on { color: var(--green); }
    .onboard {
      background: #1a221c center/cover no-repeat;
      color: #fff;
      padding-bottom: calc(24px + var(--safe-bot));
    }
    .onboard h1, .onboard p { color: #fff; }
    .onboard .bubble p { color: var(--muted); }
    .dim {
      background: rgba(16,22,18,.42);
      min-height: 100dvh;
      margin: -18px -16px;
      padding: calc(18px + var(--safe-top)) 16px calc(24px + var(--safe-bot));
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .chef3d {
      width: 200px; height: 280px; object-fit: contain; display: block; margin: 8px auto 0;
      filter: drop-shadow(0 14px 18px rgba(0,0,0,.28));
      background: transparent;
    }
    .chef3d.in { animation: walkIn3d 1.7s cubic-bezier(.2,.75,.2,1) forwards; }
    .chef3d.idle { animation: bob3d 3.2s ease-in-out infinite; }
    @keyframes walkIn3d {
      0% { transform: translateX(-180px) translateY(16px) scale(.86); opacity: 0; }
      25% { opacity: 1; }
      100% { transform: translateX(0) translateY(0) scale(1); opacity: 1; }
    }
    @keyframes bob3d {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }


    .chef-walk {
      position: relative; width: 210px; height: 290px; margin: 6px auto 0;
    }
    .chef-walk img {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: contain; filter: drop-shadow(0 12px 16px rgba(0,0,0,.25));
    }
    .chef-walk .fb { opacity: 0; animation: stride 0.36s steps(1) infinite; }
    .chef-walk.in { animation: walkIn3d 1.8s cubic-bezier(.2,.75,.2,1) forwards; }
    .chef-walk.idle { animation: bob3d 3s ease-in-out infinite; }
    @keyframes stride {
      0%, 49% { opacity: 0; }
      50%, 100% { opacity: 1; }
    }


    .chef-still {
      width: 200px; height: auto; max-height: 280px; object-fit: contain;
      display: block; margin: 28px auto 0;
      background: transparent;
      filter: drop-shadow(0 10px 14px rgba(0,0,0,.22));
    }

    .chef-stage {
      position: relative; width: 230px; height: 300px; margin: 4px auto 8px;
      perspective: 700px; overflow: visible;
    }
    .rig {
      position: absolute; left: 50%; bottom: 8px; width: 110px; height: 270px;
      margin-left: -55px; transform-style: preserve-3d; transform-origin: bottom center;
    }
    .rig.in { animation: approach 1.85s cubic-bezier(.18,.8,.2,1) forwards; }
    .rig.idle { animation: hover3d 3.8s ease-in-out infinite; }
    .rig * { box-sizing: border-box; }
    .rig .toque, .rig .face, .rig .coat, .rig .arm, .rig .leg, .rig .hair {
      outline: 3px solid #1a120c; outline-offset: -1px;
    }
    .speed {
      position:absolute; left:-40px; top:40px; width:70px; height:180px; pointer-events:none; opacity:0;
    }
    .rig.in .speed { animation: whoosh .9s ease-out; }
    .speed i { display:block; height:3px; background:#fff; margin:10px 0; border-radius:2px; width:70%; }
    @keyframes whoosh { 0%{opacity:.8;transform:translateX(0)} 100%{opacity:0;transform:translateX(-30px)} }
    .toque {
      position:absolute; left:28px; top:2px; width:54px; height:52px;
      background: linear-gradient(90deg,#fff 0%,#f2f2f2 40%,#d9d9d9 100%);
      border-radius: 16px 16px 4px 4px;
      box-shadow: 8px 6px 0 rgba(0,0,0,.12), inset -8px 0 0 rgba(0,0,0,.06);
    }
    .toque:before {
      content:""; position:absolute; left:8px; top:-12px; width:38px; height:20px;
      background:#fff; border-radius:50%; box-shadow: 10px 2px 0 #eee;
    }
    .band {
      position:absolute; left:26px; top:48px; width:58px; height:10px; border-radius:4px;
    }
    .rig.male .band { background: linear-gradient(90deg,#1f5c32,#2F6B3C); }
    .rig.female .band { background: linear-gradient(90deg,#C9A227,#F0C14B); }
    .hair {
      position:absolute; left:30px; top:54px; width:50px; height:20px; border-radius:20px 20px 0 0;
    }
    .rig.male .hair { background: #2b1c12; }
    .rig.female .hair {
      background: #1a1210; height: 34px; width: 58px; left: 26px;
      border-radius: 24px 24px 10px 10px;
    }
    .face {
      position:absolute; left:34px; top:58px; width:42px; height:46px; border-radius:18px;
      box-shadow: 6px 8px 0 rgba(0,0,0,.12);
    }
    .rig.male .face { background: linear-gradient(#e8b48a,#c98458); }
    .rig.female .face { background: linear-gradient(#c88858,#8f5a36); }
    .brow { position:absolute; top:12px; width:10px; height:3px; background:#2a221c; border-radius:2px; }
    .brow.l { left:8px; transform:rotate(-8deg); } .brow.r { right:8px; transform:rotate(8deg); }
    .eye { position:absolute; top:14px; width:11px; height:13px; background:#1c1612; border-radius:50%; box-shadow: inset -3px -3px 0 #fff, 0 0 0 2px #1a120c; }
    .eye.l { left:9px; } .eye.r { right:9px; }
    .rig.in .eye { animation: blink 2.8s ease-in-out infinite; }
    .mouth { position:absolute; left:12px; top:30px; width:18px; height:8px; border-bottom:3px solid #7a3d28; border-radius:0 0 12px 12px; }
    .blush { position:absolute; top:26px; width:8px; height:5px; background:rgba(230,80,90,.35); border-radius:50%; }
    .blush.l { left:4px; } .blush.r { right:4px; }
    .coat {
      position:absolute; left:20px; top:104px; width:70px; height:78px; border-radius:12px 12px 8px 8px;
      background: linear-gradient(115deg,#fff 0%,#f4f4f4 45%,#cfcfcf 100%);
      box-shadow: 10px 12px 0 rgba(0,0,0,.14);
    }
    .rig.male .coat { border-left: 5px solid #2F6B3C; }
    .rig.female .coat { border-left: 5px solid #D4A017; }
    .pin {
      position:absolute; right:8px; top:10px; width:10px; height:10px; border-radius:50%;
      background: radial-gradient(circle at 30% 30%,#fff,#D4A017 45%,#8a6a10);
    }
    .studs span {
      position:absolute; left:32px; width:6px; height:6px; border-radius:50%;
      background: radial-gradient(circle at 30% 30%,#fff8dc,#D4A017);
    }
    .scarf {
      display:none; position:absolute; left:28px; top:98px; width:54px; height:12px;
      background: linear-gradient(90deg,#D4A017,#F0C14B); border-radius:6px; transform:rotate(-6deg);
    }
    .rig.female .scarf { display:block; }
    .arm {
      position:absolute; top:110px; width:14px; height:58px; border-radius:10px;
      background: linear-gradient(#fff,#d8d8d8); transform-origin: top center;
    }
    .arm.l { left:8px; } .arm.r { right:8px; }
    .rig.in .arm.l { animation: swingL .36s linear 5; }
    .rig.in .arm.r { animation: swingR .36s linear 5; }
    .hand { position:absolute; bottom:-8px; left:1px; width:12px; height:12px; border-radius:50%; }
    .rig.male .hand { background:#c98458; } .rig.female .hand { background:#8f5a36; }
    .pants {
      position:absolute; left:30px; top:176px; width:50px; height:18px; border-radius:4px;
    }
    .rig.male .pants { background:#1a1a1a; }
    .rig.female .pants { background:#2a2118; }
    .leg {

    }

    @keyframes approach {

      20% { opacity:1; }

    @keyframes stepL { 0%{transform:rotateX(0) rotate(18deg)} 50%{transform:rotateX(8deg) rotate(-18deg)} 100%{transform:rotateX(0) rotate(18deg)} }
    @keyframes stepR { 0%{transform:rotateX(0) rotate(-18deg)} 50%{transform:rotateX(8deg) rotate(18deg)} 100%{transform:rotateX(0) rotate(-18deg)} }
    @keyframes swingL { 0%{transform:rotate(-16deg)} 50%{transform:rotate(16deg)} 100%{transform:rotate(-16deg)} }
    @keyframes swingR { 0%{transform:rotate(16deg)} 50%{transform:rotate(-16deg)} 100%{transform:rotate(16deg)} }

    .speech {

    .buddy {

      animation: buddyWander 7s ease-in-out infinite;

    .buddy-x {
      position:absolute; top:-12px; right:-8px; width:22px; height:22px; border:0;
      border-radius:50%; background:#C62828; color:#fff; font-size:12px; font-weight:800;
      z-index:3; cursor:pointer; line-height:22px; padding:0;
      box-shadow: 0 2px 6px rgba(0,0,0,.25);
    }
    .buddy-face {
      width: 58px; height: 58px; border-radius: 50%; border: 3px solid #fff;

    .icon-row { display:flex; align-items:center; gap:14px; }

    .mug {
      width:36px; height:48px; position:relative; flex-shrink:0;
    }
    .mug .glass {
      position:absolute; left:4px; top:8px; width:22px; height:34px;
      border:3px solid #F0C14B; border-top:0; border-radius:0 0 6px 6px;
      overflow:hidden; background:rgba(255,255,255,.12);
    }
    .mug .beer {
      position:absolute; left:0; right:0; bottom:0; height:70%;
      background: linear-gradient(#F0C14B,#C98912);
      animation: beerFill 2.4s ease-in-out infinite;
    }
    .mug .foam {
      position:absolute; left:2px; top:4px; width:26px; height:10px;
      background:#fff; border-radius:6px; animation: foamBob 1.4s ease-in-out infinite;
    }
    .mug .handle {
      position:absolute; right:0; top:16px; width:10px; height:16px;
      border:3px solid #F0C14B; border-left:0; border-radius:0 8px 8px 0;
    }
    @keyframes beerFill { 0%,100%{height:58%} 50%{height:78%} }
    @keyframes foamBob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }
    .drop {
      width:28px; height:40px; position:relative; flex-shrink:0;
    }
    .drop:before {
      content:""; position:absolute; left:6px; top:0; width:16px; height:22px;
      background:#3AA0C8; border-radius:50% 50% 50% 50% / 40% 40% 60% 60%;
      transform: rotate(45deg);
      animation: drip 1.6s ease-in-out infinite;
    }
    @keyframes drip {
      0%,100%{transform:rotate(45deg) translateY(0); opacity:1}

    }
    .feet { width:40px; height:36px; position:relative; flex-shrink:0; font-size:22px; }
    .feet span { position:absolute; animation: stepHop .7s ease-in-out infinite; }
    .feet .l { left:0; } .feet .r { right:0; animation-delay:.35s; }
    @keyframes stepHop { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
    .beer-pips { display:flex; flex-wrap:wrap; gap:4px; margin-top:8px; }
    .pip { width:14px; height:22px; border-radius:3px; background:#3a342c; }
    .pip.on { background:#D4A017; animation: pipPop .35s ease; }

    .viewfinder {

    }

      position: absolute; right: 58px; bottom: 6px; width: 170px;

    @keyframes buddyWander {
      0%,100% { transform: translate(0,0) rotate(0); }
      25% { transform: translate(-10px,-8px) rotate(-8deg); }
      50% { transform: translate(8px,-14px) rotate(6deg); }
      75% { transform: translate(-6px,6px) rotate(-4deg); }
    }
    @keyframes buddySpinPeek {
      0%,100% { transform: rotate(0) scale(1); }
      15% { transform: rotate(-18deg) scale(1.08); }
      30% { transform: rotate(16deg) scale(1.05); }
      60% { transform: rotate(0) scale(1) translateY(-4px); }
      80% { transform: rotate(10deg) scale(1.06); }
    }
    @keyframes buddyJump { 0%{transform:scale(1)} 40%{transform:scale(1.2) translateY(-12px)} 100%{transform:scale(1)} }
    @keyframes buddyDroop { 0%,100%{transform:rotate(-10deg) translateY(3px)} 50%{transform:rotate(8deg) translateY(6px)} }

    .ob-top { display:flex; align-items:center; gap:12px; margin-bottom:12px; }

    /* chef tossing a pan: page load and plan generation */
    .cook-load { position:fixed; inset:0; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px;
      color:#fff; transition:opacity .35s ease, visibility 0s;
      background:radial-gradient(circle at 12% 10%, rgba(212,160,23,.45), transparent 42%),
                 radial-gradient(circle at 88% 85%, rgba(47,107,60,.55), transparent 50%), #0E1911; }
    .cook-load.out { opacity:0; visibility:hidden; pointer-events:none; transition:opacity .35s ease, visibility 0s .35s; }
    .cook-load p { margin:0; padding:0 24px; font-size:21px; font-weight:800; text-align:center; }
    .cook-art { position:relative; width:230px; height:170px; }
    .cook-art svg { position:absolute; left:0; bottom:0; width:230px; height:auto; transform-origin:86% 70%; animation:panToss 1.2s ease-in-out infinite; }
    .cook-art .fd { position:absolute; bottom:62px; left:var(--x); font-size:26px; line-height:1; animation:foodToss 1.2s ease-in-out infinite; animation-delay:var(--d); }
    @keyframes panToss { 0%,100% { transform:rotate(0); } 30% { transform:rotate(7deg) translateY(3px); } 50% { transform:rotate(-6deg); } 70% { transform:rotate(0); } }
    @keyframes foodToss { 0%,30%,100% { transform:translateY(0) rotate(0); } 62% { transform:translateY(-70px) rotate(var(--r)); } }
    @media (prefers-reduced-motion: reduce) { .cook-art svg, .cook-art .fd { animation:none; } }
    /* Today screen v2 + nav (ui-ux-pro-max pass) */

    .tab .tab-ic { display:grid; place-items:center; width:40px; height:28px; border-radius:14px; transition:background .2s ease; }
    .tab.on .tab-ic { background:var(--goldsoft); }

    .tab-main.on .tab-ic { background:var(--green); outline:3px solid var(--goldsoft); }
    .tab:focus-visible, .round:focus-visible, .link:focus-visible, .btn:focus-visible, .chip:focus-visible { outline:3px solid var(--gold); outline-offset:2px; }

  {id:"fiber", tag:"Health", tagEs:"Salud", enTitle:"Why fiber is the quiet diet tool", esTitle:"Por qué la fibra es la herramienta silenciosa",
    en:"Most people chase protein and ignore fiber. Fiber slows digestion, feeds gut bacteria, and makes a calorie budget feel larger than it is. Aim for vegetables or beans at two meals, and fruit with the third. If you jump from 10 g to 40 g overnight you may feel bloated. Add a little each day and drink water.",

  {id:"oil", tag:"Cooking", tagEs:"Cocina", enTitle:"The olive-oil illusion", esTitle:"La ilusión del aceite de oliva",

  {id:"protein", tag:"Diet", tagEs:"Dieta", enTitle:"How much protein is enough?", esTitle:"¿Cuánta proteína alcanza?",
    en:"A simple target is about 1.6 grams per kilogram of body weight if you lift or if you are in a calorie deficit. Spread it across meals. Eggs, yogurt, fish, tofu, beans, and chicken all count. More than 2.2 g/kg rarely helps outside of specific sport blocks.",

  {id:"ultra", tag:"Curious", tagEs:"Curiosidad", enTitle:"Why bagged snacks vanish", esTitle:"Por qué desaparece la botana",

  {id:"shop", tag:"Magazine", tagEs:"Revista", enTitle:"A quieter grocery list", esTitle:"Una lista de súper más quieta",

    es:"16:8 solo significa comer en una ventana de ocho horas. A algunas personas les ayuda a saltarse la comida nocturna automática. No es magia, y es mala idea en embarazo, con antecedente de TCA o si te da temblor. Si lo pruebas, agua, sal y sueño lo más estables posible."},

    es:"A Ramsay se le conoce por Hell’s Kitchen y Kitchen Nightmares. La historia más quieta es el comedor de Londres que sostuvo tres estrellas Michelin: sala chica, precisión enorme, salsas al momento. El genio de TV es un personaje. La lección útil en casa es la otra costumbre: probar, limpiar el borde y mandar solo lo que tú te comerías."},
  {id:"child", tag:"Books", tagEs:"Libros", enTitle:"A page from the Child idea of cooking", esTitle:"Una página de la idea Child de cocinar",

    es:"MasterChef, Top Chef y Bake Off parecen concursos. Debajo entrenan tres músculos: mise en place (todo listo), probar sobre la marcha y contar una historia clara en el plato. Quien copia las cámaras copia el pánico. Copia la mise en place. Una tabla limpia gana a un salvataje dramático."},

function obSteps() {
  const s = ["gender","name","age","height","weight","activity","strength","health","goal"];
  if (S.goal && S.goal !== "maintain") s.push("goalWeight","speed");
  return s.concat(["result","diet","allergies","meals","pantryPick"]);
}
function opts(list, cur, key, multi) {
  return list.map(([v, ic, label, desc]) => {
    const on = multi ? (S[key] || []).includes(v) : cur === v;
    const attr = multi ? `data-multi="${key}" data-val="${v}"` : `data-set="${key}" data-val="${v}"`;
    return `<button class="opt ${on ? "on" : ""}" ${attr}>
      <span class="ic">${ICONS[ic] ? icon(ic, 24) : ic}</span><span><b>${label}</b>${desc ? `<small>${desc}</small>` : ""}</span>
    </button>`;
  }).join("");
}
function fmtW(kg) { return isUS() ? `${lbFromKg(kg)} ${t().unitLb}` : `${Math.round(kg*10)/10} ${t().unitKg}`; }
function projSVG(fromKg, toKg, weeks) {
  const T = t();
  const loc = S.lang === "es" ? "es-MX" : "en-US";
  const end = new Date(Date.now() + weeks * 7 * 864e5);
  const mid = new Date(Date.now() + weeks * 3.5 * 864e5);
  const f = d => d.toLocaleDateString(loc, { month:"short", day:"numeric" });
  const up = toKg > fromKg;
  const y0 = up ? 96 : 34, y1 = up ? 34 : 96;
  const lbl = kg => isUS() ? `${Math.round(lbFromKg(kg))} lb` : `${Math.round(kg)} kg`;
  return `<svg viewBox="0 0 300 150" class="proj" role="img" aria-label="${lbl(fromKg)} → ${lbl(toKg)}">
    <defs><linearGradient id="pg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#D4A017" stop-opacity=".35"/><stop offset="1" stop-color="#D4A017" stop-opacity="0"/></linearGradient></defs>
    <path d="M24 ${y0} C 110 ${y0}, 170 ${y1}, 262 ${y1} L262 120 L24 120 Z" fill="url(#pg)"/>
    <path d="M24 ${y0} C 110 ${y0}, 170 ${y1}, 262 ${y1}" fill="none" stroke="#D4A017" stroke-width="3" stroke-linecap="round"/>
    <circle cx="24" cy="${y0}" r="6" fill="#fff" stroke="#D4A017" stroke-width="3"/>
    <circle cx="262" cy="${y1}" r="6" fill="#fff" stroke="#2F6B3C" stroke-width="3"/>
    <text x="24" y="${y0-14}" text-anchor="start" font-size="13" font-weight="800" fill="#1C2A1F">${lbl(fromKg)}</text>
    <text x="262" y="${y1-14}" text-anchor="end" font-size="13" font-weight="800" fill="#2F6B3C">${lbl(toKg)}</text>
    <text x="24" y="142" font-size="11" fill="#6B7A6E">${T.today}</text>
    <text x="143" y="142" text-anchor="middle" font-size="11" fill="#6B7A6E">${f(mid)}</text>
    <text x="262" y="142" text-anchor="end" font-size="11" font-weight="800" fill="#1C2A1F">${f(end)}</text>
  </svg>`;
}
function resultBody() {
  const T = t();
  const tg = targets();
  const pos = Math.round((tg.cal - tg.low) / Math.max(1, tg.high - tg.low) * 100);
  const waterTxt = isUS() ? `${Math.round(tg.water/29.5735)} ${T.oz}` : `${tg.water} ${T.ml}`;
  const kg = Number(S.weight), goalKg = Number(S.goalWeight);
  const showProj = !tg.restricted && S.goal !== "maintain" && kg > 0 && goalKg > 0 && tg.weekly > 0 && goalKg !== kg;
  const weeks = showProj ? Math.abs(goalKg - kg) / tg.weekly : 0;
  const styles = [["rec",T.mRec],["highProtein",T.mHigh],["lowCarb",T.mLowCarb],["keto",T.mKeto],["lowFat",T.mLowFat]];
  return `<div class="res-kcal">${tg.cal.toLocaleString()} kcal</div>
    <div class="range"><i style="left:${pos}%"></i></div>
    <div class="row hint"><span>${tg.low.toLocaleString()}</span><span>${T.range}</span><span>${tg.high.toLocaleString()}</span></div>
    <div class="hint">${T.rangeWhy}</div>
    <div class="macro3">
      <div><small>${T.protein}</small><b>${tg.protein} g</b></div>
      <div><small>${T.carbs}</small><b>${tg.carbs} g</b></div>
      <div><small>${T.fat}</small><b>${tg.fat} g</b></div>
    </div>
    <div class="tiny" style="margin-top:14px">${T.macroStyleQ}</div>
    <div class="chips" style="margin-top:6px">${styles.map(([v,l]) => `<button class="chip ${ (S.macroStyle||"rec")===v?"on":""}" data-set="macroStyle" data-val="${v}">${l}</button>`).join("")}</div>
    ${tg.restricted ? `<div class="warn">${T.hold}</div>` : ""}
    ${showProj ? `<div class="tiny" style="margin-top:14px">${T.projQ}</div>${projSVG(kg, goalKg, weeks)}
      <div class="hint">${T.reachBy} ${fmtW(goalKg)} ${T.by} ${new Date(Date.now()+weeks*7*864e5).toLocaleDateString(S.lang==="es"?"es-MX":"en-US",{month:"long",day:"numeric",year:"numeric"})}. ${T.estimate}</div>` : ""}
    <div class="plan-row"><div><b>${T.burns}</b><div class="muted">${T.whatTDEE}</div></div><div><b>${tg.tdee}</b></div></div>
    <div class="plan-row"><div><b>${T.water} ${waterTxt}</b><div class="muted">${T.waterWhy}</div></div></div>
    <div class="hint">${T.notMedical}</div>`;
}

function ringSVG(pct) {
  const p = Math.max(0, Math.min(1, pct));
  const dash = (2 * Math.PI * 42 * p).toFixed(1);
  const gap = (2 * Math.PI * 42).toFixed(1);
  return `<div class="ring-wrap" style="width:120px;height:120px;margin:8px auto">
    <svg viewBox="0 0 100 100" width="120" height="120">
      <circle cx="50" cy="50" r="42" fill="none" stroke="#E4D9C5" stroke-width="10"/>
      <circle cx="50" cy="50" r="42" fill="none" stroke="#2F6B3C" stroke-width="10" stroke-linecap="round"
        stroke-dasharray="${dash} ${gap}" transform="rotate(-90 50 50)"/>
    </svg>
    <b>${Math.round(p*100)}%</b>
  </div>`;
}
function lineSVG(week, maxCal, goal) {
  const w = 320, h = 110, pad = 16;
  const n = Math.max(1, week.length - 1);
  const pts = week.map((d, i) => {
    const x = pad + i * ((w - 2 * pad) / n);
    const y = h - pad - ((d.cal / maxCal) * (h - 2 * pad));
    return [x, y];
  });
  const path = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
  const gy = h - pad - ((goal / maxCal) * (h - 2 * pad));
  const dots = pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#2F6B3C"/>`).join("");
  const labels = week.map((d, i) => `<text x="${pts[i][0]}" y="${h - 2}" text-anchor="middle" font-size="9" fill="#6B7A6E">${d.label.slice(3)}</text>`).join("");
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="110">
    <line x1="${pad}" y1="${gy}" x2="${w-pad}" y2="${gy}" stroke="#D4A017" stroke-dasharray="4 4"/>
    <path d="${path}" fill="none" stroke="#2F6B3C" stroke-width="2.5"/>
    ${dots}${labels}
  </svg>`;
}
function chartBox(used, tg, week, maxCal) {
  const type = S.chartType === "week" ? "line" : (S.chartType || "ring");
  if (type === "bars") {
    return `<div class="chart" style="height:110px;margin:8px 0 0">${week.map(d => `<div class="cbar"><i style="height:${Math.max(6,(d.cal/maxCal)*100)}%"></i><span>${d.label.slice(3)}</span></div>`).join("")}</div>`;
  }
  if (type === "line") {
    return lineSVG(week, maxCal, tg.cal);
  }
  return ringSVG(used / (tg.cal || 1));
}
function rateFood(food) {
  const remain = Math.max(0, targets().cal - usedCals());
  const goal = S.goal || "maintain";
  if (food.cal > remain + 80) return "bad";
  if (goal === "lose" && food.cal > 500) return "bad";
  if (food.cal <= Math.max(220, remain * 0.3) && food.p >= 6) return "good";
  if (food.cal <= remain * 0.55) return "fair";
  return "fair";
}
// grade plus plain reasons, checked against the user's own profile
function verdict(food) {
  const T = t();
  const out = { grade: rateFood(food), reasons: [] };
  const bad = msg => { out.grade = "bad"; out.reasons.push({ k:"bad", msg }); };
  const warn = msg => { if (out.grade === "good") out.grade = "fair"; out.reasons.push({ k:"fair", msg }); };
  const al = (S.allergies || []).filter(a => a !== "none");
  const has = food.allergens || ((FOOD_META[food.id] || {}).al) || [];
  const names = { gluten:T.aGluten, dairy:T.aDairy, egg:T.aEgg, peanut:T.aPeanut, treenut:T.aTreenut, fish:T.aFish, shellfish:T.aShell, soy:T.aSoy };
  has.filter(a => al.includes(a)).forEach(a => bad(`${T.vAllergy} ${names[a]}.`));
  const kind = (FOOD_META[food.id] || {}).k;
  if (S.dietPref === "vegan" && (food.vegan === false || (kind && kind !== "plant"))) bad(T.vNotVegan);
  if (S.dietPref === "vegetarian" && (food.vegetarian === false || ["meat","fish","shellfish"].includes(kind))) bad(T.vNotVeg);
  const remain = Math.max(0, targets().cal - usedCals());
  if (food.cal > remain + 80) bad(`${food.cal} kcal · ${T.vOver} ${remain} kcal.`);
  if (food.sugar >= 25) bad(`${food.sugar} g ${T.vSugarDay}`);
  else if (food.sugar >= 12.5) warn(`${food.sugar} g ${T.vSugar}`);
  if (food.salt >= 1.5) warn(`${food.salt} g ${T.vSalt}`);
  if (S.macroStyle === "keto" && food.c > 15) warn(`${food.c} g ${T.vKeto}`);
  if (!out.reasons.length && food.p >= 10) out.reasons.push({ k:"good", msg:`${food.p} g ${T.vProtein}` });
  if (!out.reasons.length && out.grade === "good") out.reasons.push({ k:"good", msg: T.vFits });
  return out;
}

function onWalkMotion(e) {
  const a = e.accelerationIncludingGravity || e.acceleration;
  if (!a) return;
  const mag = Math.sqrt((a.x||0)**2 + (a.y||0)**2 + (a.z||0)**2);
  const now = Date.now();
  if (walkMag > 12.2 && mag < walkMag && now - walkLast > 280) {
    walkLast = now;
    day().steps = (day().steps || 0) + 1;
    persistWrite();
    const n = document.getElementById("liveSteps");
    if (n) n.textContent = day().steps;
  }
  walkMag = mag;
}
async function toggleWalk() {
  if (S.walkOn) {
    S.walkOn = false;
    window.removeEventListener("devicemotion", onWalkMotion);
    persist();
    return;
  }
  try {
    if (typeof DeviceMotionEvent !== "undefined" && DeviceMotionEvent.requestPermission) {
      const perm = await DeviceMotionEvent.requestPermission();
      if (perm !== "granted") { persist(); return; }
    }
  } catch (e) {}
  S.walkOn = true;
  window.addEventListener("devicemotion", onWalkMotion);
  persist();
}

async function identifyMealFile(file) {
  S.scanBusy = true; S.scanErr = ""; persist();

        const txt = await hidden.scanFile(file, true);

      } catch (e) {}

    await loadScript("https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.21.0/dist/tf.min.js");

async function shrinkImage(file, max) {
  const img = document.createElement("img");
  img.src = URL.createObjectURL(file);
  await img.decode();
  const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement("canvas");
  c.width = Math.round(img.naturalWidth * k);
  c.height = Math.round(img.naturalHeight * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(img.src);
  return c.toDataURL("image/jpeg", 0.82).split(",")[1];
}

function offToFood(p, barcode) {
  const n = p.nutriments || {};
  // use per-serving numbers only when the package gives them, never mix with per-100 g
  const per = n["energy-kcal_serving"] != null ? "_serving" : "_100g";
  const v = k => Number(n[k + per] || 0);
  const name = p.product_name_en || p.product_name || p.generic_name || barcode || "Food";
  const nameEs = p.product_name_es || p.product_name || name;
  const AL = { "en:milk":"dairy", "en:gluten":"gluten", "en:eggs":"egg", "en:peanuts":"peanut", "en:nuts":"treenut",
    "en:fish":"fish", "en:crustaceans":"shellfish", "en:molluscs":"shellfish", "en:soybeans":"soy" };
  const tags = (p.allergens_tags || []).concat(p.traces_tags || []);
  const analysis = p.ingredients_analysis_tags || [];
  return {
    id: "off-" + (p.code || barcode || name).toString().slice(0,24),
    en: name, es: nameEs, cal: Math.round(v("energy-kcal")), p: Math.round(v("proteins")), c: Math.round(v("carbohydrates")),
    f: Math.round(v("fat")), sugar: Math.round(v("sugars") * 10) / 10, salt: Math.round(v("salt") * 10) / 10,
    per: per === "_serving" ? (p.serving_size || "1") : "100 g",
    allergens: [...new Set(tags.map(t => AL[t]).filter(Boolean))],
    vegan: analysis.includes("en:vegan") ? true : analysis.includes("en:non-vegan") ? false : null,
    vegetarian: analysis.includes("en:vegetarian") ? true : analysis.includes("en:non-vegetarian") ? false : null,
    source: "Open Food Facts", barcode: p.code || barcode || ""
  };
}
async function lookupBarcode(code) {
  S.scanBusy = true; S.scanErr = ""; persist();
  try {
    const r = await fetch(VISION.endpoint ? VISION.endpoint.replace(/\/$/, "") + "/off/product/" + encodeURIComponent(code) : "https://world.openfoodfacts.org/api/v2/product/" + encodeURIComponent(code) + ".json");
    const j = await r.json();
    if (j.status !== 1 || !j.product) {
      S.scanErr = t().scanMiss;
      S.scanHits = [];
    } else {
      S.scanHits = [offToFood(j.product, code)];
      S.scanPick = S.scanHits[0].id;
      S.scrollResult = true;
    }
  } catch (e) {
    S.scanErr = t().scanNet;
  }
  S.scanBusy = false;
  persist();
}
async function searchFoodName(q) {
  S.scanBusy = true; S.scanErr = ""; persist();
  const local = allFoods().filter(f => (f.en+" "+f.es+" "+(f.tags||[]).join(" ")).toLowerCase().includes(q.toLowerCase()));
  let remote = [];
  try {
    const url = VISION.endpoint ? VISION.endpoint.replace(/\/$/, "") + "/off/search?q=" + encodeURIComponent(q) : "https://world.openfoodfacts.org/cgi/search.pl?search_terms=" + encodeURIComponent(q) + "&search_simple=1&action=process&json=1&page_size=8";
    const r = await fetch(url);
    const j = await r.json();
    remote = (j.products || []).map(p => offToFood(p, p.code)).filter(f => f.en);
  } catch (e) {
    S.scanErr = t().scanNet;
  }
  const seen = {};
  S.scanHits = [...local.map(f => ({...f, source:"Saboria"})), ...remote].filter(f => {
    const k = (f.en||"").toLowerCase();
    if (seen[k]) return false;
    seen[k] = 1;
    return true;
  }).slice(0, 10);
  if (!S.scanHits.length && !S.scanErr) S.scanErr = t().scanMiss;
  if (S.scanHits[0]) S.scanPick = S.scanHits[0].id;
  S.scanBusy = false;
  persist();
}

function mealSlots() {

function plain(s) { return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
function recipeOK(r) {
  const foods = r.need.map(id => FOOD_META[id] || {k:"plant", al:[]});
  const kinds = foods.map(f => f.k);
  const pref = S.dietPref || "balanced";
  if (pref === "vegan" && kinds.some(k => k !== "plant")) return false;
  if (pref === "vegetarian" && kinds.some(k => ["meat","fish","shellfish"].includes(k))) return false;
  if (pref === "pescatarian" && kinds.includes("meat")) return false;
  const al = (S.allergies || []).filter(a => a !== "none");
  if (foods.some(f => f.al.some(a => al.includes(a)))) return false;
  const words = plain(S.dislikes).split(/[,;\n]+/).map(w => w.trim()).filter(w => w.length >= 3);
  if (words.length) {
    const hay = [r.en, r.es].concat(r.need.flatMap(id => {
      const f = FOODS.find(x => x.id === id);
      return f ? [f.en, f.es].concat(f.tags || []) : [];
    })).map(plain).join(" | ");
    if (words.some(w => hay.includes(w))) return false;

}
function recipesFor(k) {
  const type = k.startsWith("s") ? "s" : k;
  const have = r => r.need.filter(id => S.pantry.includes(id)).length / r.need.length;
  return RECIPES.filter(r => (MEAL_OF[r.id] || []).includes(type) && recipeOK(r))
    .sort((a, b) => have(b) - have(a));
}
function portion(r, kcal) {
  const mult = Math.min(3, Math.max(.5, Math.round(kcal / r.cal * 4) / 4));
  return { id:r.id, mult, cal:Math.round(r.cal*mult), p:Math.round(r.p*mult), c:Math.round(r.c*mult), f:Math.round(r.f*mult) };
}
function slotTarget(k, goal) {

}
// nudge portions a quarter at a time until the day is within 4% of the goal
function balanceDay(day, goal) {
  for (let n = 0; n < 12; n++) {
    const total = planDayCals(day);
    const diff = goal - total;
    if (Math.abs(diff) <= goal * .04) return;
    let best = null;
    Object.keys(day).forEach(k => {
      const m = day[k];
      const r = m && m.id && m.mult && RECIPES.find(x => x.id === m.id);
      if (!r) return;
      const mult = m.mult + (diff > 0 ? .25 : -.25);
      if (mult < .5 || mult > 3) return;
      const gain = Math.abs(diff) - Math.abs(diff - (r.cal*mult - m.cal));
      if (gain > 0 && (!best || gain > best.gain)) best = { k, r, mult, gain };
    });
    if (!best) return;
    day[best.k] = portion(best.r, best.r.cal * best.mult);

}
function generateWeek() {
  const goal = targets().cal;
  const slots = mealSlots();
  const seed = S.seed || 1;
  S.weekPlan = Array.from({length:7}, (_, d) => {
    const day = {};
    slots.forEach((k, si) => {
      const pool = recipesFor(k);
      if (!pool.length) { day[k] = null; return; }
      let r = pool[(d + seed + si) % pool.length];
      const usedToday = Object.values(day).map(m => m && m.id);
      for (let j = 1; usedToday.includes(r.id) && j < pool.length; j++) r = pool[(d + seed + si + j) % pool.length];
      day[k] = portion(r, slotTarget(k, goal));
    });

function swapSlot(i, k) {

  const pool = recipesFor(k);
  if (!pool.length) return;
  const at = cur ? pool.findIndex(r => r.id === cur.id) : -1;
  const r = pool[(at + 1) % pool.length];

function groceryList() {

    const q = m && m.id && QTY[m.id];

    Object.entries(q).forEach(([id, n]) => { need[id] = (need[id] || 0) + n * (m.mult || 1); });

    const f = FOODS.find(x => x.id === id);

  if (gotTip) gotTip.onclick = () => { S.tipDismissed = today(); persist(); };
  document.querySelectorAll("[data-chart]").forEach(b => b.onclick = () => { S.chartType = b.dataset.chart; persist(); });
  document.querySelectorAll("[data-scanfood]").forEach(b => b.onclick = () => { S.scanFood = b.dataset.scanfood; persist(); });
  document.querySelectorAll("[data-logscan]").forEach(b => b.onclick = () => {
    const f = FOODS.find(x => x.id === b.dataset.logscan);
    if (f) day().foods.push({...f});
    const g = verdict(f).grade;
    helperSay(g === "good" ? "happy" : "sad", g === "good" ? "happyFood" : "sadFood");
    persist();
  });
  const addFridgeItem = document.getElementById("addFridgeItem");
  if (addFridgeItem) addFridgeItem.onclick = () => {
    const raw = ((document.getElementById("customFood") || {}).value || "").trim().toLowerCase();
    if (!raw) return;
    const hit = allFoods().find(f => f.en.toLowerCase().includes(raw) || f.es.toLowerCase().includes(raw) || (f.tags||[]).some(x => x.includes(raw)));
    if (hit) {
      if (!S.pantry.includes(hit.id)) S.pantry.push(hit.id);
    } else {
      const id = "c-" + raw.replace(/\s+/g, "-").slice(0, 24);
      S.customItems = S.customItems || [];
      if (!S.customItems.some(x => x.id === id)) S.customItems.push({id, en: raw, es: raw, cal: 100, p: 3, c: 10, f: 3, tags: [raw], aisle: "other"});
      if (!S.pantry.includes(id)) S.pantry.push(id);
    }
    persist();
  };
  const scanFile = document.getElementById("scanFile");
  if (scanFile) scanFile.onchange = () => {
    const file = scanFile.files && scanFile.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { S.scanPhoto = reader.result; persist(); };
    reader.readAsDataURL(file);
  };
  const lookupBar = document.getElementById("lookupBar");
  if (lookupBar) lookupBar.onclick = () => {
    const code = ((document.getElementById("barCode")||{}).value || "").replace(/\s/g,"");
    S.scanCode = code;
    if (code.length >= 8) lookupBarcode(code);
  };
  const lookupName = document.getElementById("lookupName");
  if (lookupName) lookupName.onclick = () => {
    const q = ((document.getElementById("foodQ")||{}).value || "").trim();
    S.scanQ = q;
    if (q.length >= 2) searchFoodName(q);
  };
  const foodQ = document.getElementById("foodQ");
  if (foodQ) foodQ.onkeydown = (e) => { if (e.key==="Enter") { e.preventDefault(); lookupName && lookupName.click(); } };
  const barCode = document.getElementById("barCode");
  if (barCode) barCode.onkeydown = (e) => { if (e.key==="Enter") { e.preventDefault(); lookupBar && lookupBar.click(); } };
  document.querySelectorAll("[data-scanpick]").forEach(b => b.onclick = () => { S.scanPick = b.dataset.scanpick; persist(); });
  const logHit = document.getElementById("logHit");
  if (logHit) logHit.onclick = () => {
    const f = (S.scanHits||[]).find(x => x.id === S.scanPick);
    if (!f) return;
    day().foods.push({id:f.id,en:f.en,es:f.es,cal:f.cal||0,p:f.p,c:f.c,f:f.f});
    const g = verdict(f).grade;
    helperSay(g === "good" ? "happy" : "sad", g === "good" ? "happyFood" : "sadFood");
    persist();
  };
  const snapMeal = document.getElementById("snapMeal");
  if (snapMeal) snapMeal.onclick = () => document.getElementById("scanFile").click();
  const rescan = document.getElementById("rescan");
  if (rescan) rescan.onclick = () => { S.scanHits = []; S.scanPick = null; S.scanErr = ""; S.aiMeal = null; S.scanPhoto = null; persist(); };
  document.querySelectorAll("[data-aigrams]").forEach(el => el.onchange = () => {
    const it = S.aiMeal && S.aiMeal.items[Number(el.dataset.aigrams)];
    const g = Math.max(0, Math.round(Number(el.value) || 0));
    if (!it || !it.base.grams) return;
    const k = g / it.base.grams;
    Object.assign(it, { grams: g, kcal: Math.round(it.base.kcal * k), protein_g: Math.round(it.base.protein_g * k),
      carbs_g: Math.round(it.base.carbs_g * k), fat_g: Math.round(it.base.fat_g * k) });
    persist();
  });
  document.querySelectorAll("[data-aidel]").forEach(b => b.onclick = () => {
    S.aiMeal.items.splice(Number(b.dataset.aidel), 1); persist();
  });
  const logAi = document.getElementById("logAi");
  if (logAi) logAi.onclick = () => {
    const now = Date.now();
    S.aiMeal.items.forEach((it, i) => day().foods.push({ id: "ai-" + now + "-" + i, en: it.name, es: it.name,
      cal: it.kcal, p: it.protein_g, c: it.carbs_g, f: it.fat_g }));
    const total = S.aiMeal.items.reduce((a, it) => ({ cal: a.cal + it.kcal, p: a.p + it.protein_g }), { cal: 0, p: 0 });
    const g = rateFood(total);
    helperSay(g === "good" ? "happy" : "sad", g === "good" ? "happyFood" : "sadFood");
    S.aiMeal = null; S.scanPhoto = null; S.scanErr = "";
    persist();
  };
  if (scanFile) {
    const prev = scanFile.onchange;
    scanFile.onchange = () => {
      const file = scanFile.files && scanFile.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => { S.scanPhoto = reader.result; };
      reader.readAsDataURL(file);
      S.aiMeal = null;
      identifyMealFile(file);
    };
  }
  if (S.tab === "scan" && document.getElementById("liveCam") && !window._saboriaStream && !window._saboriaCamTried && !(S.scanHits||[]).length) {
    window._saboriaCamTried = true;
    const video = document.getElementById("liveCam");
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    }).then(stream => {
      if (S.tab !== "scan") { stream.getTracks().forEach(tr => tr.stop()); return; }
      window._saboriaStream = stream;
      video.srcObject = stream;
      video.play().catch(()=>{});
      S.scanCamOk = true;
      const hint = document.querySelector(".screen .muted");
      if (hint && hint.textContent && hint.textContent.indexOf("undefined") >= 0) hint.textContent = "Hold steady on the barcode…";
      const tick = async () => {
        if (!window._saboriaStream || window._saboriaLock) return;
        try {
          if ("BarcodeDetector" in window) {
            window._saboriaDet = window._saboriaDet || new BarcodeDetector({ formats: ["ean_13","ean_8","upc_a","upc_e","code_128","qr_code"] });
            const codes = await window._saboriaDet.detect(video);
            if (codes && codes[0] && codes[0].rawValue) {
              const code = String(codes[0].rawValue).replace(/\s/g,"");
              if (code.length >= 8) {
                window._saboriaLock = true;
                S.scanCode = code;
                stopScanCam();
                lookupBarcode(code).finally(() => { window._saboriaLock = false; });
              }
            }
          }
        } catch (e) {}
      };
      window._saboriaTimer = setInterval(tick, 450);
    }).catch(() => {
      S.scanErr = (t().camFail || "Allow the camera, or open the site with https:// not the file.");
      persist();
    });
  }
  document.querySelectorAll("[data-scanmode]").forEach(b => b.onclick = () => {
    stopScanCam(); window._saboriaCamTried = false;
    S.scanMode = b.dataset.scanmode; S.scanErr = ""; S.scanHits = []; S.scanPick = null; S.aiMeal = null; S.scanPhoto = null;
    persist();
  });
  const scanResult = document.getElementById("scanResult");
  if (scanResult && S.scrollResult) { S.scrollResult = false; scanResult.scrollIntoView({ block: "start", behavior: "smooth" }); }
  if (S.tab !== "scan" || (S.scanMode || "code") !== "code") { stopScanCam(); if (S.tab !== "scan") window._saboriaCamTried = false; }
  document.querySelectorAll("[data-beer]").forEach(b => b.onclick = () => {
    const d = day();
    d.cans = d.cans || 0; d.bottles = d.bottles || 0;
    if (b.dataset.beer === "cans") d.cans += 1;
    else if (b.dataset.beer === "bottles") d.bottles += 1;
    else {
      if (d.bottles) d.bottles -= 1;
      else if (d.cans) d.cans -= 1;
    }
    persist();
  });
  document.querySelectorAll("[data-water]").forEach(b => b.onclick = () => {
    day().water += Number(b.dataset.water);
    helperSay("happy", "happyWater");
    persist();
  });
  document.querySelectorAll("[data-steps]").forEach(b => b.onclick = () => {
    day().steps = (day().steps || 0) + Number(b.dataset.steps);
    persist();
  });
  const addSteps = document.getElementById("addSteps");
  if (addSteps) addSteps.onclick = () => {
    const n = Math.max(0, Math.round(Number((document.getElementById("stepAmt")||{}).value || 0)));
    if (!n) return;
    day().steps = (day().steps || 0) + n;
    persist();
  };
  const walkBtn = document.getElementById("walkBtn");
  if (walkBtn) walkBtn.onclick = () => toggleWalk();
  document.querySelectorAll("[data-article]").forEach(b => b.onclick = () => {
    S.articleId = b.dataset.article;
    S.tab = "read";
    persist();
  });
  const nextTip = document.getElementById("nextTip");
  if (nextTip) nextTip.onclick = () => { rotateTip(); persist(); };
  const addCustomWater = document.getElementById("addCustomWater");
  if (addCustomWater) addCustomWater.onclick = () => {
    const raw = Number((document.getElementById("waterAmt") || {}).value || 0);
    if (!raw) return;
    day().water += isUS() ? Math.round(raw * 29.5735) : raw;
    helperSay("happy", "happyWater"); persist();
  };
  document.querySelectorAll("[data-add]").forEach(b => b.onclick = () => {
    const f = FOODS.find(x=>x.id===b.dataset.add);
    day().foods.push({...f}); persist();
  });
  document.querySelectorAll("[data-logplan]").forEach(b => b.onclick = () => {
    const k = b.dataset.logplan;
    const m = S.weekPlan && S.weekPlan[todayIndex()] && S.weekPlan[todayIndex()][k];
    if (!m) return;
    const name = mealName(m);
    const food = { id: "plan-" + today() + "-" + k, en: name, es: name, cal: m.cal || 0, p: m.p || 0, c: m.c || 0, f: m.f || 0 };
    day().foods.push(food);
    helperSay(verdict(food).grade === "good" ? "happy" : "sad", verdict(food).grade === "good" ? "happyFood" : "sadFood");
    persist();
  });
  document.querySelectorAll("[data-unlog]").forEach(b => b.onclick = () => {
    const d = day(); d.foods = d.foods.filter(f => f.id !== b.dataset.unlog); persist();
  });
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    day().foods.splice(Number(b.dataset.del),1); persist();
  });
  document.querySelectorAll("[data-pan]").forEach(b => b.onclick = () => {
    const id=b.dataset.pan;
    S.pantry = S.pantry.includes(id) ? S.pantry.filter(x=>x!==id) : S.pantry.concat(id);
    persist();
  });
  document.querySelectorAll("[data-logrec]").forEach(b => b.onclick = () => {
    const r = RECIPES.find(x=>x.id===b.dataset.logrec);
    const food = {id:r.id,en:r.en,es:r.es,cal:r.cal,p:r.p,c:r.c,f:r.f};
    day().foods.push(food);
    const g = rateFood(food);
    helperSay(g === "good" ? "happy" : "sad", g === "good" ? "happyFood" : "sadFood");
    persist();
  });
  document.querySelectorAll("[data-prot]").forEach(b => b.onclick = () => { S.protocol=b.dataset.prot; persist(); });
  const field = document.getElementById("field");
  const fieldFt = document.getElementById("fieldFt");
  const fieldIn = document.getElementById("fieldIn");
  const next = document.getElementById("next");
  function grabField() {
    if (S.step === "height") {
      if (isUS()) {
        S.heightFt = fieldFt ? fieldFt.value : S.heightFt;
        S.heightIn = fieldIn ? fieldIn.value : S.heightIn;
        S.height = String(cmFromFtIn(S.heightFt, S.heightIn));
      } else if (field) {
        S.height = field.value;
      }
      return;
    }
    if ((S.step === "weight" || S.step === "goalWeight") && field) {
      if (isUS()) {
        if (S.step === "weight") { S.weightLb = field.value; S.weight = String(kgFromLb(field.value)); }
        else { S.goalWeightLb = field.value; S.goalWeight = String(kgFromLb(field.value)); }
      } else {
        if (S.step === "weight") S.weight = field.value;
        else S.goalWeight = field.value;
      }
      return;
    }
    if (field) S[S.step] = field.value;
  }
  function goNext() {
    grabField();
    if (!canContinue()) return;
    const steps = obSteps();
    const i = steps.indexOf(S.step);
    if (i === steps.length - 1) {
      showCook(t().cooking, 1800, () => { generateWeek(); S.onboarded = true; S.tab = "plan"; rotateTip(); persist(); });
      return;
    }
    S.step = steps[i+1]; persist();
  }
  const obBack = document.getElementById("obBack");
  if (obBack) obBack.onclick = () => {
    grabField();
    const steps = obSteps();
    S.step = steps[Math.max(0, steps.indexOf(S.step) - 1)]; persist();
  };
  document.querySelectorAll("[data-multi]").forEach(b => b.onclick = () => {
    const key = b.dataset.multi, v = b.dataset.val;
    let cur = (S[key] || []).slice();
    if (v === "none") cur = cur.includes("none") ? [] : ["none"];
    else {
      cur = cur.filter(x => x !== "none");
      cur = cur.includes(v) ? cur.filter(x => x !== v) : cur.concat(v);
    }
    S[key] = cur; persist();
  });
  const dislikes = document.getElementById("dislikes");
  if (dislikes) dislikes.oninput = () => { S.dislikes = dislikes.value.slice(0, 300); persistWrite(); };
  const openGrocery = document.getElementById("openGrocery");
  if (openGrocery) openGrocery.onclick = () => { S.planView = "grocery"; persist(); window.scrollTo(0, 0); };
  const backPlan = document.getElementById("backPlan");
  if (backPlan) backPlan.onclick = () => { S.planView = null; persist(); };
  document.querySelectorAll("[data-gcheck]").forEach(b => b.onclick = () => {
    const id = b.dataset.gcheck, d = S.groceryDone || [];
    S.groceryDone = d.includes(id) ? d.filter(x => x !== id) : d.concat(id); persist();
  });
  const genWeek = document.getElementById("genWeek");
  if (genWeek) genWeek.onclick = () => showCook(t().cooking, 1600, () => { generateWeek(); persist(); });
  document.querySelectorAll("[data-swap]").forEach(b => b.onclick = () => {
    const [i, k] = b.dataset.swap.split("-");
    swapSlot(Number(i), k); persist();
  });
  function bindInput(el) {
    if (!el) return;
    el.oninput = () => { grabField(); if (next) next.disabled = !canContinue(); };
    el.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); goNext(); } };
  }
  bindInput(field);
  bindInput(fieldFt);
  bindInput(fieldIn);
  const search = document.getElementById("search");
  if (search) search.oninput = () => { S.q = search.value; persist(); };
  if (next) next.onclick = goNext;
  const water = document.getElementById("water");
  if (water) water.onclick = () => { day().water += 250; helperSay("happy","happyWater"); persist(); };
  const fast = document.getElementById("fast");
  if (fast) fast.onclick = () => { S.fastingStart = S.fastingStart ? null : Date.now(); persist(); };
  const redo = document.getElementById("redo");
  if (redo) redo.onclick = () => { S.onboarded=false; S.sex=null; S.step="lang"; persist(); };
  const regen = document.getElementById("regen");
  if (regen) regen.onclick = () => { S.seed = (S.seed||1)+1; persist(); };
  const makeCustom = document.getElementById("makeCustom");
  if (makeCustom) makeCustom.onclick = () => { S.planCustom = true; S.weekPlan = emptyWeek(); persist(); };
  const clearPlan = document.getElementById("clearPlan");
  if (clearPlan) clearPlan.onclick = () => { S.weekPlan = emptyWeek(); persist(); };
  document.querySelectorAll("[data-addslot]").forEach(b => b.onclick = () => {
    const [i,k] = b.dataset.addslot.split("-");
    const nameEl = document.querySelector('[data-mname="'+b.dataset.addslot+'"]');
    const calEl = document.querySelector('[data-mcal="'+b.dataset.addslot+'"]');
    const name = ((nameEl&&nameEl.value)||"").trim();
    const cal = Math.max(0, Math.round(Number((calEl&&calEl.value)||0)));
    if (!name) return;
    if (!S.weekPlan) S.weekPlan = emptyWeek();
    S.weekPlan[Number(i)][k] = { name, cal };
    persist();
  });
  document.querySelectorAll("[data-clearslot]").forEach(b => b.onclick = () => {
    const [i,k] = b.dataset.clearslot.split("-");
    if (S.weekPlan && S.weekPlan[Number(i)]) S.weekPlan[Number(i)][k] = null;
    persist();
  });
  document.querySelectorAll("[data-pickrec]").forEach(b => b.onclick = () => {
    const parts = b.dataset.pickrec.split("-");
    const i = Number(parts[0]); const k = parts[1];
    const rid = parts.slice(2).join("-");
    const r = RECIPES.find(x => x.id === rid);
    if (!r) return;
    if (!S.weekPlan) S.weekPlan = emptyWeek();
    S.weekPlan[i][k] = { name: S.lang==="es"?r.es:r.en, cal: r.cal, id: r.id };
    persist();
  });

  const chooseGuest = document.getElementById("chooseGuest");
  if (chooseGuest) chooseGuest.onclick = () => {
    const lang = S.lang || "en";
    S = blankState();
    S.mode = "guest";
    S.lang = lang;
    S.step = "lang";
    persist();
  };
  const chooseLogin = document.getElementById("chooseLogin");
  if (chooseLogin) chooseLogin.onclick = () => {
    S.mode = "user";
    S.authView = "auth";
    S.authMsg = "";
    persist();
  };
  const backGate = document.getElementById("backGate");
  if (backGate) backGate.onclick = () => {
    S.mode = null;
    S.authView = "gate";
    persist();
  };
  function creds() {
    const u = (document.getElementById("userField") || {}).value || "";
    const p = (document.getElementById("passField") || {}).value || "";
    const email = (document.getElementById("emailField") || {}).value || "";
    return { u: u.trim(), p, email: email.trim() };
  }
  function welcomeCopy(name, lang) {
    const who = name || "chef";
    if (lang === "es") return {
      subject: "Tu lugar en la mesa de Saboria está listo",
      body: "Hola "+who+",\n\nLa cocina ya está encendida. No te pedimos perfección — solo el siguiente plato un poco más amable que el anterior.\n\nAgua cuando te acuerdes. Pasos cuando puedas. Cena sin culpa. Nosotros guardamos los números; tú guarda el sabor.\n\nTe esperamos en la tabla.\n\n— El equipo de Saboria"
    };
    return {
      subject: "Your seat at Saboria is warm",
      body: "Hi "+who+",\n\nThe burners are on. We are not here to police your plate. We are here so tomorrow’s lunch is a little kinder than yesterday’s guesswork.\n\nDrink the water. Count the steps you actually took. Leave room for a Saturday taco.\n\nSee you at the board.\n\n— The Saboria kitchen"
    };
  }
  function sendWelcome(email, name, lang) {
    if (!email || !MAIL.publicKey || !MAIL.serviceId || !MAIL.templateId) return;
    try {
      if (window.emailjs && !S._mailInit) { emailjs.init({ publicKey: MAIL.publicKey }); S._mailInit = true; }
      const c = welcomeCopy(name, lang);
      emailjs.send(MAIL.serviceId, MAIL.templateId, {
        to_email: email,
        to_name: name || "friend",
        subject: c.subject,
        message: c.body
      }).catch(function(){});
    } catch (e) {}
  }
  const doCreate = document.getElementById("doCreate");
  if (doCreate) doCreate.onclick = async () => {
    if (!window.crypto || !crypto.subtle) { S.authMsg = t().needHttps; persist(); return; }
    const T = t();
    const { u, p, email } = creds();
    if (!u || !p) { S.authMsg = T.needBoth; persist(); return; }
    const all = accounts();
    if (all[u]) { S.authMsg = T.exists; persist(); return; }
    const lang = S.lang || "en";
    S = blankState();
    S.mode = "user";
    S.username = u;
    S.email = email;
    S.authView = "done";
    S.lang = lang;
    S.step = "lang";
    all[u] = { ...(await hashPass(p)), email: email, state: publicState(S) };
    setAccounts(all);
    LS.setItem(SESSION_KEY, u);
    persist();
    sendWelcome(email, u, lang);
  };
  const doSignin = document.getElementById("doSignin");
  if (doSignin) doSignin.onclick = async () => {
    if (!window.crypto || !crypto.subtle) { S.authMsg = t().needHttps; persist(); return; }
    const T = t();
    const { u, p } = creds();
    const all = accounts();
    if (!(await checkPass(all[u], p))) { S.authMsg = T.authErr; persist(); return; }
    if (all[u].pass !== undefined) { Object.assign(all[u], await hashPass(p)); delete all[u].pass; setAccounts(all); }
    S = Object.assign(blankState(), all[u].state, { mode:"user", username:u, authView:"done" });
    LS.setItem(SESSION_KEY, u);
    persist();
  };
  const logout = document.getElementById("logout");
  if (logout) logout.onclick = () => {
    SS.removeItem(GUEST_KEY);
    LS.removeItem(SESSION_KEY);
    S = blankState();
    persist();
  };
}

window.addEventListener("pagehide", () => {
  if (S.mode !== "user") {
    SS.removeItem(GUEST_KEY);
  }
});
setInterval(() => { if (S.onboarded && S.tab==="more" && S.fastingStart) render(); }, 1000);
render();
hideBoot();
</script>
</body>
</html>
